# Static analysis of the kit itself. It matters here more than in most libraries: thymekit writes
# HTML and sanitises markdown, so a mistake in this code becomes an injection in someone else's page.
name: codeql

on:
  push:
  workflow_dispatch:
  schedule:
    # Once a week, so newly published queries reach old code without waiting for the next commit.
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # security-extended adds the queries that are precise enough to act on but are not in the
          # default set; quality queries are left out, that is what our own gates are for.
          queries: security-extended
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile for analysis
        run: ./gradlew classes testClasses
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
