name: attribution

# Every commit an agent writes names the agent. Under one account the machine cannot be
# told from the person by who is signed in, so it is told by what the record says: a marked
# commit is machine work, an unmarked one is a person's. That only holds while the mark is
# required rather than remembered — which is what this check makes true.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  attributed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A pull request written by hand carries the label instead: a person does not sign
      # every commit, and the absence of a signature is what says the work is theirs.
      - name: Every commit names the agent that wrote it
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'by-hand') }}
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          unmarked=0
          for sha in $(git rev-list --no-merges "$base..$head"); do
            if ! git show -s --format=%B "$sha" | grep -qE '^Agent: [a-z0-9][a-z0-9-]*$'; then
              printf 'unmarked  %s  %s\n' "$(git rev-parse --short "$sha")" "$(git show -s --format=%s "$sha")"
              unmarked=1
            fi
          done
          if [ "$unmarked" = 1 ]; then
            cat <<'TXT'

          A commit written by an agent ends with a trailer naming it:

              Agent: developer-1

          A commit written by hand is not marked; label the pull request "by-hand" to say so.
          TXT
            exit 1
          fi
          echo 'every commit names the agent that wrote it'
