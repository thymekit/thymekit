name: build

on:
  push:
    branches: [ main ]
  pull_request:

# A new push to the same branch cancels the previous run: the result of an outdated commit
# is of no interest to anyone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/
          retention-days: 7

  mutation:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Mutation gate
        run: ./gradlew pitest
      - name: Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: build/reports/pitest/
          retention-days: 7

  # The site lives on the gh-pages branch: the reports from main at the root, and a snapshot of the
  # showcase for every commit under /showcase/. A snapshot is what makes a change visible before it is
  # merged — you open the page rather than imagine it.
  publish:
    needs: [build, mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # Publishing rewrites one branch, so runs queue instead of racing each other.
    concurrency:
      group: publish-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Produce the reports (main only; a branch publishes just its snapshot)
        if: github.ref == 'refs/heads/main'
        run: ./gradlew build javadoc pitest

      - name: Render the showcase
        if: github.ref != 'refs/heads/main'
        run: ./gradlew test

      - name: Assemble
        run: python3 .github/site/build-site.py

      - name: Publish to gh-pages
        env:
          # On a pull_request event GITHUB_SHA is a synthetic merge commit; a snapshot has to be
          # labelled with the commit a person actually pushed.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SUBJECT: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: |
          git config user.name thymekit
          git config user.email 318698958+thymekit@users.noreply.github.com
          rm -rf /tmp/gh && mkdir /tmp/gh
          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git fetch -q --depth=1 origin gh-pages
            git --work-tree=/tmp/gh checkout -q FETCH_HEAD -- .
          fi
          python3 .github/site/publish.py /tmp/gh "$SHA" "$BRANCH" "$(printf '%s' "$SUBJECT" | head -1)"
          cd /tmp/gh
          git init -q -b gh-pages
          git add -A
          git commit -qm "site: $BRANCH ${SHA:0:8}"
          # one commit, always: the branch carries content, not a history of publications
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
