<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--/* Adapters the walk is tried on. Each is written to be wrong in exactly one way, so that what the
       walk says can be read off the fixture rather than guessed. */-->

<!--/* keys: text */-->
<th:block th:fragment="echoEl(e)"><i class="echo" th:text="${e['text']}"></i></th:block>

<!--/* a declaration speaks for the fragment under it: this one declares nothing and inherits nothing */-->
<th:block th:fragment="undeclaredEl(e)"><i class="echo" th:text="${e['text']}"></i></th:block>

<!--/* keys: title */-->
<!--/* slots: items */-->
<th:block th:fragment="slottedEl(e)"><div class="echo" th:text="${e['title']}"></div>
<th:block th:replace="~{thymekit/element :: slot(${e}, 'items')}"/></th:block>

<!--/* keys: title */-->
<!--/* slots: items */-->
<th:block th:fragment="slotIgnoredEl(e)"><div class="echo" th:text="${e['title']}"></div></th:block>

<!--/* keys: text, colour */-->
<th:block th:fragment="deadKeyEl(e)"><i class="echo" th:text="${e['text']}"></i></th:block>

<!--/* a fragment named in a comment defines nothing: th:fragment="ghostEl(e)" is prose, not markup */-->

<!--/* and a name that is not shaped like an adapter at all */-->
<th:block th:fragment="notAnAdapter(e)"><i class="echo">plain</i></th:block>

<!--/* the names the hero's guards ask for: these elements live in consumer code */-->
<!--/* keys: text */-->
<span th:fragment="statusBadgeEl(e)" th:text="${e['text']}"></span>
<!--/* keys: text */-->
<div th:fragment="actionsEl(e)" th:text="${e['text']}"></div>

<!--/* declares a slot and no keys at all */-->
<!--/* slots: items */-->
<th:block th:fragment="slotsOnlyEl(e)"><th:block th:replace="~{thymekit/element :: slot(${e}, 'items')}"/></th:block>

<!--/* prints words and no tag of its own */-->
<!--/* keys: text */-->
<th:block th:fragment="wordsOnlyEl(e)" th:text="${e['text']}"></th:block>

<!--/* falls over without the key it reads: taking it away is not a quiet difference but a loud one */-->
<!--/* keys: text */-->
<th:block th:fragment="needsItEl(e)"><i class="echo" th:text="${e['text'].length()}"></i></th:block>

<!--/* prints a class the kit's stylesheets know nothing about */-->
<!--/* keys: text */-->
<th:block th:fragment="strangerEl(e)"><i class="not-a-kit-class" th:text="${e['text']}"></i></th:block>
</body>
</html>
