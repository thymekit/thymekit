<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--/* a preserved tag whose content arrives from another file: if the handler stopped counting at the
       boundary, the seven spaces below would come out as the four the depth would have produced */-->
<div th:fragment="outer">
    <pre><th:block th:replace="~{test/preserved-inner :: inner}"/></pre>
</div>

<!--/* and one that dies inside a preserved tag: nothing of it may reach the next render */-->
<div th:fragment="dies">
    <pre>
        <span th:text="${missing.thing.deeper}">boom</span>
    </pre>
</div>
</body>
</html>
