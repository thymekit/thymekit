<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<!--/*
    md-section: a section with a heading, XSS-safe markdown rendering and an empty state with an
    optional "add" affordance.

    Keys of the descriptor it reads:
      heading   a Heading element; absent renders no heading
      markdown  source text; absent switches the section to its empty state
      emptyHint empty-state text; absent together with absent markdown renders nothing at all
      addAction any element shown next to the empty state; absent renders none
      linkRel   what the links of the text say about themselves; absent marks nothing

    The #md expression object comes from the kit's auto-configuration.
*/-->
<!--/*
    The section carries a name only when its heading was given an id. Deciding to give a section an
    address is deciding that it stands on its own, and what stands on its own deserves a name; where
    nobody decided that, the section stays an ordinary box rather than one more landmark to step over.

    One fragment, one signature: the adapter reads the descriptor itself. A second entry point taking
    the parts apart was a contract of its own, and it changed silently the day the descriptor grew a
    key — exactly what the adapter-name rule exists to prevent.
*/-->
<section th:fragment="mdSectionEl(e)"
         class="tk-section"
         th:attr="aria-labelledby=${e['heading'] == null ? null : e['heading']['id']}"
         th:if="${e['markdown'] != null or e['emptyHint'] != null}">
    <!--/* the heading is an element; render is null-safe, so no th:if belongs here */-->
    <th:block th:replace="~{fragments/thymekit/element :: render(${e['heading']})}"/>
    <div class="rich-content" th:if="${e['markdown'] != null}"
         th:utext="${#md.toHtmlSafe(e['markdown'], e['linkRel'])}"></div>
    <!--/* a div, not a p: the affordance is whatever element the consumer passed, block or inline */-->
    <div class="detail-empty-hint" th:if="${e['markdown'] == null}">
        <span th:text="${e['emptyHint']}"></span>
        <th:block th:replace="~{fragments/thymekit/element :: render(${e['addAction']})}"/>
    </div>
</section>

</body>
</html>
